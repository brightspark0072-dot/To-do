<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Rewards To-Do</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --pink: #ff6b9e;
            --blue: #6bcfe3;
            --grey: #8c92ac;
            --light-grey: #f4f5f7;
            --dark-grey: #4a4e69;
            --bg: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--light-grey); color: var(--dark-grey); display: flex; flex-direction: column; height: 100vh; }
        
        /* Navigation */
        nav { background-color: var(--blue); display: flex; justify-content: space-around; padding: 15px; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        nav div { cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        nav div:hover { color: var(--pink); }

        /* Sections */
        .section { display: none; padding: 20px; flex: 1; overflow-y: auto; }
        .section.active { display: flex; flex-direction: column; }

        /* Home Screen */
        .clock { font-size: 3rem; font-weight: bold; text-align: center; margin-top: 20px; color: var(--pink); }
        .date { font-size: 1.2rem; text-align: center; color: var(--grey); margin-bottom: 30px; }
        .stats-card { background: white; padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 2px solid var(--blue); }
        .score { font-size: 2.5rem; color: var(--pink); font-weight: bold; }

        /* Task Input */
        .input-group { display: flex; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 15px; border: 2px solid var(--grey); border-radius: 10px 0 0 10px; font-size: 1rem; outline: none; }
        input[type="text"]:focus { border-color: var(--blue); }
        button { background-color: var(--pink); color: white; border: none; padding: 15px 20px; border-radius: 0 10px 10px 0; cursor: pointer; font-size: 1rem; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #e65a8d; }

        /* Task List */
        .task { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid var(--blue); transition: 0.3s; }
        .task.completed { border-left-color: var(--grey); opacity: 0.7; }
        .task.completed span { text-decoration: line-through; color: var(--grey); }
        .checkbox { width: 25px; height: 25px; cursor: pointer; accent-color: var(--pink); }

        /* History */
        .history-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--grey); }
        .history-date { font-weight: bold; color: var(--blue); margin-bottom: 10px; border-bottom: 1px solid var(--light-grey); padding-bottom: 5px; }

        /* Gamification Reward Notification */
        #reward-toast { position: fixed; bottom: -50px; left: 50%; transform: translateX(-50%); background-color: var(--pink); color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; transition: 0.3s; opacity: 0; }
        #reward-toast.show { bottom: 20px; opacity: 1; }
    </style>
</head>
<body>

    <nav>
        <div onclick="switchTab('home')">🏠 Home</div>
        <div onclick="switchTab('active')">🩵 Active</div>
        <div onclick="switchTab('history')">🩶 History</div>
    </nav>

    <div id="home" class="section active">
        <div class="clock" id="clock">00:00:00</div>
        <div class="date" id="date">Loading date...</div>
        <div class="stats-card">
            <h2>Your Rewards 🫠</h2>
            <p>Tasks Completed</p>
            <div class="score" id="score">0</div>
        </div>
    </div>

    <div id="active" class="section">
        <div class="input-group">
            <input type="text" id="task-input" placeholder="Add a new task...">
            <button onclick="addTask()">Add 💞</button>
        </div>
        <div id="task-list"></div>
    </div>

    <div id="history" class="section">
        <h2 style="margin-bottom: 15px; color: var(--dark-grey);">Past Quests</h2>
        <div id="history-list"></div>
    </div>

    <div id="reward-toast">+10 Points! Keep melting through tasks! 🫠</div>

    <script>
        // State Management
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let history = JSON.parse(localStorage.getItem('history')) || {};
        let score = parseInt(localStorage.getItem('score')) || 0;
        let lastLoginDate = localStorage.getItem('lastLoginDate');

        // Check for new day to move active tasks to history
        const todayStr = new Date().toDateString();
        if (lastLoginDate && lastLoginDate !== todayStr) {
            if (tasks.length > 0) {
                history[lastLoginDate] = tasks;
                tasks = []; // Reset active tasks for the new day
                localStorage.setItem('history', JSON.stringify(history));
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }
        }
        localStorage.setItem('lastLoginDate', todayStr);

        // Core Functions
        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(tabId === 'active') renderTasks();
            if(tabId === 'history') renderHistory();
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
            document.getElementById('date').innerText = now.toDateString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        function updateScore() {
            document.getElementById('score').innerText = score;
            localStorage.setItem('score', score);
        }
        updateScore();

        function showReward() {
            const toast = document.getElementById('reward-toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function addTask() {
            const input = document.getElementById('task-input');
            const text = input.value.trim();
            if (!text) return;
            
            tasks.push({ id: Date.now(), text, completed: false });
            input.value = '';
            saveAndRender();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            task.completed = !task.completed;
            
            if (task.completed) {
                score += 10;
                showReward();
                updateScore();
            } else {
                score -= 10; // Penalty for un-completing
                updateScore();
            }
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = `task ${task.completed ? 'completed' : ''}`;
                div.innerHTML = `
                    <span>${task.text}</span>
                    <input type="checkbox" class="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                `;
                list.appendChild(div);
            });
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            const dates = Object.keys(history).reverse(); // Newest first
            
            if (dates.length === 0) {
                list.innerHTML = '<p style="color: var(--grey)">No history yet. Get to work! 💪</p>';
                return;
            }

            dates.forEach(date => {
                const dayTasks = history[date];
                const card = document.createElement('div');
                card.className = 'history-card';
                let tasksHTML = dayTasks.map(t => 
                    `<div style="text-decoration: ${t.completed ? 'line-through' : 'none'}; color: ${t.completed ? 'var(--grey)' : 'var(--dark-grey)'}">
                        ${t.completed ? '✅' : '❌'} ${t.text}
                    </div>`
                ).join('');
                
                card.innerHTML = `<div class="history-date">${date}</div>${tasksHTML}`;
                list.appendChild(card);
            });
        }

        // Initialize App
        renderTasks();

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('auth.js').then(reg => {
                    console.log('Service Worker Registered');
                });
            });
        }
    </script>
</body>
</html>
